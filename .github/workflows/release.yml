name: Release Build

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v1.0.0)

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: dll
            lib_ext: lib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
            lib_ext: a
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: dylib
            lib_ext: a

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - name: Build in release mode
      shell: bash
      run: |
        cargo build --release --target ${{ matrix.target }}
        mkdir -p release
        
        # On Windows, copy both .dll and .lib files
        if [ "${{ runner.os }}" = "Windows" ]; then
          if [ -f "target/${{ matrix.target }}/release/kadugu_net.dll" ]; then
            cp target/${{ matrix.target }}/release/kadugu_net.dll release/
          fi
          if [ -f "target/${{ matrix.target }}/release/kadugu_net.lib" ]; then
            cp target/${{ matrix.target }}/release/kadugu_net.lib release/
          fi
        # On Unix-like systems, copy the shared library and static library
        else
          if [ -f "target/${{ matrix.target }}/release/libkadugu_net.${{ matrix.ext }}" ]; then
            cp target/${{ matrix.target }}/release/libkadugu_net.${{ matrix.ext }} release/
          fi
          if [ -f "target/${{ matrix.target }}/release/libkadugu_net.${{ matrix.lib_ext }}" ]; then
            cp target/${{ matrix.target }}/release/libkadugu_net.${{ matrix.lib_ext }} release/
          fi
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kadugu-net-binaries-${{ matrix.os }}
        path: release/
        if-no-files-found: error
        retention-days: 5

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Get the version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release v${{ steps.get_version.outputs.version }}
          body: |
            Pre-built binaries for kadugu-net v${{ steps.get_version.outputs.version }}
            
            ### What's Changed
            - Built for multiple platforms
            - Includes both static and dynamic libraries
          draft: false
          prerelease: false
          files: |
            artifacts/kadugu-net-binaries-*/*
